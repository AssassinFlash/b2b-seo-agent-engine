qa_gates:
- name: truth-qa
  artifact: articles/<article-slug>/truth-qa.md
  blocking_statuses:
  - BLOCK
  - blocked
  - fail
  - failed
- name: information-gain-qa
  artifact: articles/<article-slug>/information-gain-qa.md
  blocking_statuses:
  - BLOCK
  - blocked
  - fail
  - failed
- name: benchmark-drift-qa
  artifact: articles/<article-slug>/benchmark-drift-audit.md
  blocking_statuses:
  - BLOCK
  - blocked
  - fail
  - failed
- name: reader-qa
  artifact: articles/<article-slug>/reader-qa.md
  blocking_statuses:
  - BLOCK
  - blocked
  - fail
  - failed
publish_blockers:
- lockedProfile must be true
- all qa_gate artifacts must exist
- no qa_gate artifact contains a blocking status
